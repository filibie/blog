<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head(pageTitle='Create New Post')}">
</head>

<body>
    <div class="container mt-5 pt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1>Create New Blog Post</h1>
                
                <form action="/submit-post" method="post" th:object="${post}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" id="title" class="form-control" 
                               th:field="*{title}" required placeholder="Enter post title">
                    </div>
                    
                    <div class="mb-3">
                        <label for="content" class="form-label">Content <span class="text-danger">*</span></label>
                        <textarea id="content" class="form-control" 
                                  th:field="*{content}" rows="15" required placeholder="Write your blog post..."></textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label for="author" class="form-label">Author</label>
                        <input type="text" id="author" class="form-control" 
                               th:field="*{author}" placeholder="Your name (optional)">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Publish Post</button>
                </form>

                <a href="/" class="btn btn-secondary mt-3">← Back to Posts</a>
            </div>
        </div>
    </div>
</body>

</html>
