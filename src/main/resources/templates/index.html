<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>My Spring Blog</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4 text-center">Latest Blog Posts</h1>

    <div th:each="post : ${posts}" class="card mb-3 shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${post.title}">Post Title</h5>
            <p class="card-text text-muted small">Published on: <span th:text="${#temporals.format(post.createdAt, 'MMMMM dd, yyyy')}">Date</span></p>
            <!-- Displaying a snippet of content -->
            <p class="card-text" th:text="${T(java.util.stream.Stream).of(post.content).limit(100).findFirst().orElse('')}"></p>
            <a href="#" class="btn btn-primary read-more">Read More</a>
        </div>
    </div>

    <div th:if="${posts == null || posts.empty}" class="alert alert-warning mt-5" role="alert">
        No blog posts found. Start writing!
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
