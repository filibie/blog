<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head(pageTitle='Home')}">
</head>

<body>
    <div class="container mt-5 pt-3">
        <h1 class="mb-4 text-center">Blog Posts</h1>

        <div class="row" th:if="${posts != null and !posts.isEmpty()}">
            <div class="col-md-4 mb-4" th:each="post : ${posts}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${post.title}">Post Title</h5>
                        <p class="card-text text-muted small mb-2">
                            Published on: <span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}">Date</span>
                        </p>
                        <p class="card-text" th:utext="${post.content != null and post.content.length() > 0 ? #strings.abbreviate(post.content, 200) + '...' : ''}"></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted" th:text="${post.author ?: 'Unknown'}">Author</small>
                            <a th:href="@{/post/{id}(id=${post.id})}" class="btn btn-sm btn-outline-primary">Read More</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${posts == null || posts.isEmpty()}" class="alert alert-info mt-5 text-center" role="alert">
            No blog posts found. Be the first to write one!
        </div>
    </div>
</body>

</html>
