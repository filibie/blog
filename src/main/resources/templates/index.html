<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head(pageTitle='Home')}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
<div class="container mt-4 pt-3 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Header & Search -->
            <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="fw-bold mb-0">Articles</h1>
                    <p class="text-muted mb-0 small">Latest posts and updates</p>
                </div>
                <form th:action="@{/posts}" method="get" class="input-group" style="max-width: 280px;">
                    <input type="text" name="search" th:value="${param.search}"
                           class="form-control form-control-sm" placeholder="Search posts...">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">
                        <i class="bi bi-search"></i> Search
                    </button>
                </form>
            </div>

            <!-- Blog Posts List -->
            <div class="bg-white rounded shadow-sm border p-4" th:if="${posts != null and !posts.isEmpty()}">
                <div class="list-group list-group-flush">

                    <article th:each="post, iterStat : ${posts}" class="list-group-item px-0 py-4"
                             th:classappend="${iterStat.first} ? 'pt-2' : ''">

                        <!-- Post Title -->
                        <h2 class="h4 fw-bold mb-2">
                            <a th:href="@{/posts/{id}(id=${post.id})}"
                               th:text="${post.title}"
                               class="text-decoration-none text-dark hover-primary">
                                Post Title Placeholder
                            </a>
                        </h2>

                        <!-- Content Preview -->
                        <p class="text-secondary mb-3 small lh-base"
                           th:text="${post.content != null ? #strings.abbreviate(post.content, 180) : ''}">
                            Content excerpt preview text goes here...
                        </p>

                        <!-- Metadata & Action -->
                        <div class="d-flex justify-content-between align-items-center text-muted small">
                            <div class="d-flex gap-3 align-items-center flex-wrap">
                                <span>By <i class="bi bi-person me-1"></i> <strong class="text-dark" th:text="${post.author ?: 'Unknown'}">Author</strong></span>
                                <span>on <i class="bi bi-calendar3 me-1"></i> <time th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm:ss') : ''}">Jan 15, 2026</time></span>
                            </div>
                            <a th:href="@{/posts/{id}(id=${post.id})}" class="text-primary text-decoration-none fw-semibold">
                                Read post <i class="bi bi-arrow-right-short"></i>
                            </a>
                        </div>

                    </article>

                </div>
            </div>

            <!-- Empty State -->
            <div class="bg-white rounded shadow-sm border p-5 text-center" th:if="${posts == null or posts.isEmpty()}">
                <i class="bi bi-journal-x display-4 text-muted"></i>
                <h4 class="mt-3 text-secondary">No blog posts found</h4>
                <p class="text-muted small">Check back later or try a different search term.</p>
            </div>

            <div class="ml-auto mt-4 float-end">
                <a href="/posts/create" class="btn btn-primary">Create Post</a>
            </div>

        </div>
    </div>
</div>
</body>

</html>
