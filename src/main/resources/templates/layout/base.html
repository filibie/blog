<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="utf-8" />
    <title th:text="${pageTitle ?: 'My Spring Blog'}">My Spring Blog</title>
    <!-- Bootstrap 5.3.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/editor.css"> 
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid container">
        <a class="navbar-brand" th:href="@{/}" th:text="${pageTitle ?: 'BlogApp'}">BlogApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}" th:text="${pageTitle == 'Home' ? '' : 'Home'}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/create-post}">Create Post</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content Placeholder -->
<div class="container mt-5 pt-3" th:fragment="content">
    <!-- Page-specific content injected here -->
</div>

<!-- Footer -->
<footer class="bg-light text-center py-3 mt-5">
    <p>&copy; <span th:text="${#dates.create(T(java.time.LocalDate).now())}">2024</span> My Spring Blog</p>
</footer>

<!-- Bootstrap JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
