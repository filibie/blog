<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head(pageTitle=${post != null ? post.title : 'Blog Post'})}">
    <meta charset="UTF-8">
    <title>Blog Post</title>
</head>

<body class="bg-light">
<div class="container mt-4 pt-3 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">

            <article class="p-4 p-md-5 bg-white rounded">
                <!-- Breadcrumb Navigation -->
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Home</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/posts}" class="text-decoration-none">Posts</a></li>
                        <li class="breadcrumb-item active text-truncate" style="max-width: 200px;"
                            aria-current="page" th:text="${post?.title}">Post</li>
                    </ol>
                </nav>

                <!-- Main Article Header -->
                <header class="mb-4 pb-3 border-bottom">
                    <h1 class="fw-bold mb-3 display-6" th:text="${post?.title ?: 'Untitled Post'}">Post Title Placeholder</h1>

                    <div class="d-flex flex-wrap align-items-center text-muted small gap-3">
                        <div>
                            <i class="bi bi-person-circle me-1"></i>
                            By <strong class="text-dark" th:text="${post?.author ?: 'Unknown'}">Author Name</strong>
                        </div>
                        <div>
                            <i class="bi bi-calendar3 me-1"></i>
                            Published: <time th:text="${post?.createdAt != null ? #temporals.format(post.createdAt, 'MMMM dd, yyyy') : 'N/A'}">Jan 15, 2026</time>
                        </div>
                        <div th:if="${post?.updatedAt != null and post.updatedAt != post.createdAt}">
                            <i class="bi bi-pencil-square me-1"></i>
                            Updated: <time th:text="${#temporals.format(post.updatedAt, 'MMM dd, yyyy')}">Jan 16, 2026</time>
                        </div>
                    </div>
                </header>

                <!-- Article Body -->
                <div class="blog-content mb-5 lh-base fs-5"
                     th:utext="${post?.content ?: '<p class=text-muted>No content available for this post.</p>'}">
                    <p>Post body content goes here...</p>
                </div>

                <!-- Article Footer & Actions -->
                <footer class="pt-4 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <a th:href="@{/posts}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Posts
                    </a>

                    <!-- Optional Edit Action -->
                    <div th:if="${post?.id != null}">
                        <a th:href="@{/posts/edit/{id}(id=${post.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-pencil me-1"></i> Edit Post
                        </a>
                    </div>
                </footer>
            </article>

        </div>
    </div>
</div>
</body>
</html>
