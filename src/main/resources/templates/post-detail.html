<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head(pageTitle='Blog Post')}">
</head>

<body>
    <div class="container mt-5 pt-3">
        <article class="my-5 p-4 shadow-sm bg-white rounded">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Post</li>
                </ol>
            </nav>

            <h1 th:text="${post.title ?: 'Untitled'}">Post Title Placeholder</h1>
            <p class="text-muted border-bottom pb-2 mb-4">
                By <span th:text="${post.author ?: 'Unknown'}">Author Name</span> | Published on: 
                <time><span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}"></span></time>
            </p>

            <div class="blog-content" th:utext="${post.content ?: ''}">
            </div>

            <div class="mt-4 pt-3 border-top">
                <a href="/" class="btn btn-secondary">← Back to Posts</a>
            </div>
        </article>
    </div>
</body>

</html>
